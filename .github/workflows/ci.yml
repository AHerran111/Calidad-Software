# .github/workflows/ci.yml

name: CI – Pruebas Unitarias

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  test:
    name: pytest + cobertura
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout código
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------------
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ------------------------------------------------------------------
      # 3. Dependencias
      # ------------------------------------------------------------------
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          grep -v '^\-e ' requirements.txt > requirements_ci.txt
          pip install -r requirements_ci.txt
          pip install pytest pytest-cov

      # ------------------------------------------------------------------
      # 4. Secrets de prueba
      # ------------------------------------------------------------------
      - name: Crear utils/secrets.toml
        run: |
          cat > utils/secrets.toml << 'EOF'
          [database]
          host     = "localhost"
          dbname   = "test_cfdi"
          user     = "postgres"
          password = "postgres"
          port     = 5432
          EOF

      # ------------------------------------------------------------------
      # 5. Pruebas + cobertura
      # ------------------------------------------------------------------
      - name: Ejecutar pytest + cobertura
        run: |
          pytest tests/py_test.py -v \
            --cov=services.cfdi_generator \
            --cov=services.signer_mock \
            --cov=utils.xml_utils \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

      # ------------------------------------------------------------------
      # 6. Codecov
      # ------------------------------------------------------------------
      - name: Subir cobertura a Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false